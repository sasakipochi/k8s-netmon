<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#fff}
  svg{display:block;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}
  .frame{fill:none;stroke:#8c959f;stroke-width:2}
  .ns{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:6 5}
  .box{fill:#fff;stroke:#57606a;stroke-width:2}
  .mine{fill:#eaf2fd;stroke:#2a78d6;stroke-width:2.5}
  .ext{fill:#fff;stroke:#8c959f;stroke-width:2}
  .t{font-size:22px;font-weight:700;fill:#1f2328}
  .s{font-size:17px;fill:#424a53}
  .lbl{font-size:16px;fill:#57606a;font-weight:600}
  .grp{font-size:17px;fill:#57606a;font-weight:700}
  .a{stroke:#424a53;stroke-width:2;fill:none;marker-end:url(#arr)}
</style>
<svg width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424a53"/></marker></defs>

  <!-- host PC -->
  <rect class="frame" x="20" y="20" width="780" height="610" rx="14"/>
  <text class="grp" x="40" y="50">ホストPC（k3s）</text>
  <!-- namespace -->
  <rect class="ns" x="45" y="68" width="730" height="320" rx="10"/>
  <text class="grp" x="62" y="96">namespace: netmon</text>

  <!-- Prometheus / Grafana -->
  <rect class="box" x="70" y="118" width="280" height="96" rx="10"/>
  <text class="t" x="90" y="156">Prometheus</text>
  <text class="s" x="90" y="186">30秒ごとに収集・400日保存</text>
  <rect class="box" x="70" y="268" width="280" height="96" rx="10"/>
  <text class="t" x="90" y="306">Grafana</text>
  <text class="s" x="90" y="336">ダッシュボード自動登録</text>

  <!-- netprobe -->
  <rect class="mine" x="440" y="118" width="310" height="246" rx="10"/>
  <text class="t" x="460" y="156">netprobe</text>
  <text class="s" x="460" y="184">自作 exporter（Python）</text>
  <text class="s" x="460" y="230">・ping：5分ごと</text>
  <text class="s" x="460" y="260">・スピードテスト：毎時 :02:30</text>
  <text class="s" x="460" y="306">/metrics（:9101）</text>
  <text class="s" x="460" y="336">生ログ（JSON Lines）</text>

  <!-- arrows inside ns -->
  <path class="a" d="M440,166 L354,166"/>
  <text class="lbl" x="362" y="156">収集</text>
  <path class="a" d="M210,214 L210,264"/>
  <text class="lbl" x="220" y="246">クエリ</text>

  <!-- host dir -->
  <rect class="box" x="440" y="460" width="310" height="80" rx="10"/>
  <text class="t" x="460" y="494">ホストのディレクトリ</text>
  <text class="s" x="460" y="522">ping-*.jsonl / speedtest-*.jsonl</text>
  <path class="a" d="M595,364 L595,456"/>
  <text class="lbl" x="605" y="420">hostPath</text>

  <!-- ingress / browser -->
  <rect class="box" x="70" y="430" width="280" height="80" rx="10"/>
  <text class="t" x="90" y="464">Traefik Ingress</text>
  <text class="s" x="90" y="492">grafana.netmon.localhost</text>
  <path class="a" d="M210,426 L210,368"/>
  <rect class="box" x="70" y="556" width="280" height="56" rx="10"/>
  <text class="t" x="90" y="592">ブラウザ</text>
  <path class="a" d="M210,556 L210,514"/>

  <!-- internet -->
  <text class="grp" x="850" y="96">測定先</text>
  <rect class="ext" x="850" y="118" width="330" height="150" rx="10"/>
  <text class="t" x="870" y="156">ping</text>
  <text class="s" x="870" y="186">宅内ルータ・上流ルータ</text>
  <text class="s" x="870" y="214">1.1.1.1 / 8.8.8.8</text>
  <text class="s" x="870" y="242">www.iij.ad.jp</text>
  <rect class="ext" x="850" y="294" width="330" height="96" rx="10"/>
  <text class="t" x="870" y="332">スピードテスト</text>
  <text class="s" x="870" y="362">Cloudflare / Ookla（任意）</text>
  <path class="a" d="M750,190 L846,190"/>
  <path class="a" d="M750,330 L846,330"/>
</svg>
